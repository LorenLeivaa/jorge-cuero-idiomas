<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ポケットの中の健二</title>
<meta name="description" content="革と工房のAIアシスタント。あなたの179作品の型紙を知っていて、作業台でのお悩みを一緒に解決します。">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#3a2416">
<meta name="apple-mobile-web-app-title" content="健二">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="kenji-icono.jpg">
<link rel="icon" href="kenji.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css?v=2">
</head>
<body>

<header class="cabecera">
  <div class="marca">
    <div class="avatar">
      <img src="kenji.png" alt="" onerror="this.remove()">
      <span class="iniciales">健</span>
    </div>
    <div class="marca-texto">
      <h1>ポケットの中の健二</h1>
      <p>革と工房 ・ オンライン</p>
    </div>
    <span class="etiqueta">AIアシスタント</span>
  </div>
  <div class="acciones">
    <div class="contador" id="contador" aria-live="polite"></div>
    <button type="button" class="nuevo" id="nuevo" hidden>新しい会話</button>
  </div>
</header>

<main class="hilo" id="hilo" role="log" aria-live="polite" aria-label="会話">

  <section class="bienvenida" id="bienvenida">
    <div class="avatar avatar-grande" aria-hidden="true">
      <img src="kenji.png" alt="" onerror="this.remove()">
      <span class="iniciales">健</span>
    </div>
    <h2>こんにちは、健二です。今日の作業台はどんな様子ですか?</h2>
    <p class="bajada">
      あなたの179作品の型紙と、「職人への道」の60プロジェクトを知っています。困っていることを話してください。作品の写真を送っても、下の質問をタップしても大丈夫です。
    </p>
    <div class="sugerencias">
      <button class="sugerencia" type="button">作品がうまくいきませんでした。写真を送ってもいいですか?</button>
      <button class="sugerencia" type="button">財布BI-12には、どんな革、どれくらいの量、どんな糸が必要ですか?</button>
      <button class="sugerencia" type="button">職人への道のプロジェクト5が終わりました。次はどれを作ればいいですか?</button>
      <button class="sugerencia" type="button">リュックを自分のノートパソコンに合わせたいです。型紙をどう変えればいいですか?</button>
    </div>
  </section>

</main>

<div class="pie">
  <div class="adjunto" id="adjunto" hidden>
    <img id="adjunto-img" alt="送る写真">
    <button type="button" id="quitar-foto" aria-label="写真を外す">×</button>
  </div>
  <form class="compositor" id="compositor">
    <button type="button" id="foto" class="boton-foto" aria-label="写真を撮る・添付する">
      <svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true">
        <path d="M4 8h3l2-2.5h6L17 8h3v11H4z" fill="none" stroke="currentColor"
              stroke-width="1.9" stroke-linejoin="round"/>
        <circle cx="12" cy="13" r="3.4" fill="none" stroke="currentColor" stroke-width="1.9"/>
      </svg>
    </button>
    <input type="file" id="archivo" accept="image/*" hidden>
    <textarea id="entrada" rows="1" placeholder="健二に質問する…"
              enterkeyhint="send" autocomplete="off"
              aria-label="健二に質問する"></textarea>
    <button type="submit" id="enviar" aria-label="送信">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M12 20V5M5 12l7-7 7 7" fill="none" stroke="currentColor"
              stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </form>
  <p class="aviso">
    AIアシスタントなので、間違えることがあります。高価な革を切る前に、型紙の寸法表を確認し、厚紙か端革で試してください。
  </p>
</div>

<script src="app.js?v=2"></script>
</body>
</html>
